##--------------------------------------------------------------------
## EMQX 4.4 Redis 鉴权插件配置
## 等价于 unmtr369auth 服务的 POST /mqtt/verify 逻辑
##
## 该文件由 EMQX 启动时通过 priv/emqx_plugin_redis_auth.schema
## 映射到 emqx_plugin_redis_auth 应用的 application env。
##--------------------------------------------------------------------

##--------------------------------------------------------------------
## Redis 连接
##--------------------------------------------------------------------

## Redis 地址与端口
redis_auth.redis_host = 127.0.0.1
redis_auth.redis_port = 6379

## Redis 密码，留空表示不鉴权
## redis_auth.redis_password =

## Redis 数据库编号
redis_auth.redis_database = 0

## eredis 为单连接客户端，此处按数量启动 N 条连接，
## 查询按 redis key 哈希分摊到各连接
redis_auth.redis_pool_size = 8

## 断线重连间隔（毫秒）
redis_auth.redis_reconnect_sleep_ms = 1000

## 单次查询超时（毫秒）
redis_auth.redis_query_timeout_ms = 2000

## 建立连接超时（毫秒）
redis_auth.redis_connect_timeout_ms = 5000

##--------------------------------------------------------------------
## Redis 业务键前缀（对应 Java 的 STR_INDEX_UID2ID / STR_AP）
##--------------------------------------------------------------------

redis_auth.snindex_key_prefix = snindex:
redis_auth.ap_key_prefix = ap:
redis_auth.ap_status_field = status

## AP hash 中该值表示主通道离线（其余非空值视为在线）
redis_auth.ap_status_offline = 0

## clientId 包含该标记时按保活通道处理，并尝试从 "MAC-Tag" 中提取真实 MAC
redis_auth.keepalived_tag = Tr369KeepAlived

##--------------------------------------------------------------------
## 鉴权规则
##--------------------------------------------------------------------

## 白名单用户名（逗号分隔）：命中直接放行（对应 Java whiteServiceList）
redis_auth.white_service_list = unmtr369service,unmtr369bulkdataservice,unmtr369accessservice

## 平台管理账号（对应 Java 的 UNM2000 校验）
redis_auth.unm_username = UNM2000
redis_auth.unm_expected_password = Umc2024@Adm

## 密码为 base64(AES-128-CBC/NoPadding, 零IV, 零填充) 密文，
## 密钥对应 Java AESUtil.AES_KEY
## 注意：该值包含 # 字符，cuttlefish 只在行首把 # 当注释，因此无需引号
redis_auth.aes_key = Fiber#Aes@369069

## Redis 不可用时是否降级放行（对应 Java catch 后 return allow）
redis_auth.fallback_allow_on_redis_error = on

##--------------------------------------------------------------------
## 鉴权审计日志
##
## 鉴权成功（info）与失败（warning）写入独立文件，不再进入 emqx.log。
## 相对路径基于 EMQX 根目录解析；留空表示关闭该审计日志。
##--------------------------------------------------------------------

redis_auth.auth_log_file = log/emqx_plugin_redis_auth.log

## 单个文件大小上限（字节），超过后滚动
redis_auth.auth_log_max_size = 10485760

## 保留的滚动文件数量
redis_auth.auth_log_max_files = 5
